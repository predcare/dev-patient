# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Adjusted for 8GB RAM machine to prevent out-of-memory crashes during native compilation
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC

# Limit parallel workers to avoid RAM exhaustion on multi-core systems with 8GB RAM
org.gradle.workers.max=4

# Enables parallel execution for decoupled multi-project modules
org.gradle.parallel=true

# Enables Gradle build cache to reuse compiled artifacts across builds
org.gradle.caching=true

# Enables Kotlin incremental compilation
kotlin.incremental=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Specify architectures for development builds (arm64-v8a for physical devices, x86_64 for emulators).
# Avoid building 32-bit legacy ABIs (armeabi-v7a, x86) during development to save C++ compilation time.
# You can also pass --active-arch-only to `react-native run-android`.
reactNativeArchitectures=arm64-v8a,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Disable VFS file watching to prevent Windows file locking issues on .gradle workspace
org.gradle.vfs.watch=false

# Suppress compileSdk 36 AGP compatibility warning
android.suppressUnsupportedCompileSdk=36


